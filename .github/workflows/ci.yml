name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lipstick-manager/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: lipstick-manager
        run: pnpm install --frozen-lockfile
      - name: Verify
        working-directory: lipstick-manager
        run: pnpm check
